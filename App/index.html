<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TransCloud ERP</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/tour.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg width="32" height="32" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="48" height="48" rx="12" fill="#1a73e8"/>
                        <path d="M14 24L20 30L34 16" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>TransCloud</span>
                </div>
                <button class="sidebar-toggle" id="sidebarToggle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 12H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M3 6H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M3 18H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item active">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="3" width="7" height="7" rx="1.5" fill="currentColor"/>
                        <rect x="14" y="3" width="7" height="7" rx="1.5" fill="currentColor" opacity="0.6"/>
                        <rect x="3" y="14" width="7" height="7" rx="1.5" fill="currentColor" opacity="0.6"/>
                        <rect x="14" y="14" width="7" height="7" rx="1.5" fill="currentColor" opacity="0.4"/>
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a href="transportes.html" class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 14L7 6H17L21 14V19H19V17H5V19H3V14Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="7" cy="17" r="2" fill="currentColor"/>
                        <circle cx="17" cy="17" r="2" fill="currentColor"/>
                    </svg>
                    <span>Transportes</span>
                </a>
                <a href="relatorios.html" class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7 2H17L21 6V20C21 21.1046 20.1046 22 19 22H5C3.89543 22 3 21.1046 3 20V4C3 2.89543 3.89543 2 5 2H7Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M7 2V6H17V2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M8 13H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M8 17H12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <span>Relatórios</span>
                </a>
               <a href="configuracoes.html" class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="3.33333" stroke="currentColor" stroke-width="1.5"/><path d="M17.5 10H15.8333M4.16667 10H2.5M10 2.5V4.16667M10 15.8333V17.5M14.7142 5.28582L13.5355 6.46448M6.46448 13.5355L5.28582 14.7142M14.7142 14.7142L13.5355 13.5355M6.46448 6.46448L5.28582 5.28582" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                    <span>Configurações</span>
                </a>
                <a href="#" class="nav-item" onclick="startTour(); return false;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M12 16V12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        <circle cx="12" cy="8" r="0.5" fill="currentColor"/>
                    </svg>
                    <span>Tutorial</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="btn-logout" onclick="logout()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M16 17L21 12L16 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M21 12H9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <span>Sair</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header Padronizado -->
            
            <header class="topbar">
                <div class="topbar-left">
                    <h1>Dashboard</h1>
                </div>
                <div class="topbar-right">
                    <!-- Botão de Tema -->
                    <button class="btn-theme-toggle" id="themeToggle" title="Alternar tema">
                        <!-- Ícone do sol (modo claro) -->
                        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/>
                            <path d="M12 1V3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M12 21V23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M4.22 4.22L5.64 5.64" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M18.36 18.36L19.78 19.78" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M1 12H3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M21 12H23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M4.22 19.78L5.64 18.36" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M18.36 5.64L19.78 4.22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        <!-- Ícone da lua (modo escuro) -->
                        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    
                    <!-- Informações do Usuário -->
                    <a href="configuracoes.html" class="user-info" style="text-decoration: none; color: inherit; cursor: pointer;">
                        <span class="user-name" id="userNameDisplay">Administrador</span>
                        <div class="user-avatar">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="12" cy="8" r="4" fill="#1a73e8"/>
                                <path d="M4 20C4 17.7909 7.79086 16 12 16C16.2091 16 20 17.7909 20 20" stroke="#1a73e8" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </div>
                    </a>
                </div>
            </header>

            <div class="page-content">
                <!-- KPI Cards -->
                <div class="kpi-grid">
                    <div class="kpi-card">
                        <div class="kpi-icon-wrapper" style="background: linear-gradient(135deg, #e3f2fd, #bbdefb);">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M22 12H18L15 21L9 3L6 12H2" stroke="#1a73e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <div class="kpi-content">
                            <div class="kpi-header">
                                <span class="kpi-label">Viagens Hoje</span>
                                <span class="kpi-badge positive">+12%</span>
                            </div>
                            <span class="kpi-value" id="kpiViagensHoje">24</span>
                            <span class="kpi-subtitle">Em andamento</span>
                        </div>
                    </div>
                    
                    <div class="kpi-card">
                        <div class="kpi-icon-wrapper" style="background: linear-gradient(135deg, #e8f5e9, #c8e6c9);">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M20 6L9 17L4 12" stroke="#2e7d32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <div class="kpi-content">
                            <div class="kpi-header">
                                <span class="kpi-label">Entregas Realizadas</span>
                                <span class="kpi-badge positive">+8%</span>
                            </div>
                            <span class="kpi-value" id="kpiEntregasRealizadas">18</span>
                            <span class="kpi-subtitle">Hoje</span>
                        </div>
                    </div>
                    
                    <div class="kpi-card">
                        <div class="kpi-icon-wrapper" style="background: linear-gradient(135deg, #fff3e0, #ffe0b2);">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M1 12H3L6 3H18L21 12H23" stroke="#e65100" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <circle cx="7" cy="18" r="2" fill="#e65100" opacity="0.3" stroke="#e65100" stroke-width="1.5"/>
                                <circle cx="17" cy="18" r="2" fill="#e65100" opacity="0.3" stroke="#e65100" stroke-width="1.5"/>
                            </svg>
                        </div>
                        <div class="kpi-content">
                            <div class="kpi-header">
                                <span class="kpi-label">Em Trânsito</span>
                                <span class="kpi-badge neutral">Estável</span>
                            </div>
                            <span class="kpi-value" id="kpiEmTransito">6</span>
                            <span class="kpi-subtitle">Veículos ativos</span>
                        </div>
                    </div>
                    
                    <div class="kpi-card">
                        <div class="kpi-icon-wrapper" style="background: linear-gradient(135deg, #fce4ec, #f8bbd0);">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="12" cy="12" r="9" stroke="#c62828" stroke-width="2"/>
                                <path d="M12 7V13" stroke="#c62828" stroke-width="2" stroke-linecap="round"/>
                                <circle cx="12" cy="16" r="0.5" fill="#c62828"/>
                            </svg>
                        </div>
                        <div class="kpi-content">
                            <div class="kpi-header">
                                <span class="kpi-label">Atrasos</span>
                                <span class="kpi-badge negative">-5%</span>
                            </div>
                            <span class="kpi-value" id="kpiAtrasos">2</span>
                            <span class="kpi-subtitle">Ocorrências</span>
                        </div>
                    </div>
                </div>

                <!-- Charts Section -->
                <div class="charts-grid">
                    <div class="chart-card">
                        <div class="chart-header">
                            <h3>Viagens por Dia</h3>
                            <div class="chart-legend">
                                <span class="legend-item">
                                    <span class="legend-dot" style="background: #1a73e8;"></span>
                                    Esta semana
                                </span>
                            </div>
                        </div>
                        <div class="chart-body">
                            <canvas id="chartViagensDia"></canvas>
                        </div>
                    </div>
                    <div class="chart-card">
                        <div class="chart-header">
                            <h3>Status das Entregas</h3>
                            <div class="chart-actions">
                                <button class="btn-chart-action active">Semanal</button>
                                <button class="btn-chart-action">Mensal</button>
                            </div>
                        </div>
                        <div class="chart-body">
                            <canvas id="chartStatusEntregas"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Recent Activities -->
                <div class="card">
                    <div class="card-header">
                        <h3>Atividades Recentes</h3>
                    </div>
                    <div class="card-body" id="recentActivities">
                        <!-- Populated by JavaScript -->
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="toastContainer"></div>
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/tour.js"></script>
    <script src="js/app.js"></script>
    
</body>
</html>
