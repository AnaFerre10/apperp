<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TransCloud ERP</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg width="32" height="32" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="48" height="48" rx="12" fill="#1a73e8"/>
                        <path d="M14 24L20 30L34 16" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>TransCloud</span>
                </div>
                <button class="sidebar-toggle" id="sidebarToggle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 12H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M3 6H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M3 18H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item active">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3.33334 10L8.33334 5L13.3333 10L11.6667 10V16.6667H8.33334V12.5H6.66668V16.6667H3.33334V10Z" fill="currentColor"/>
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a href="transportes.html" class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2.5 11.6667L5.83333 5H14.1667L17.5 11.6667V15.8333H15.8333V14.1667H4.16667V15.8333H2.5V11.6667Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="5.83333" cy="14.1667" r="1.66667" fill="currentColor"/>
                        <circle cx="14.1667" cy="14.1667" r="1.66667" fill="currentColor"/>
                    </svg>
                    <span>Transportes</span>
                </a>
                <a href="relatorios.html" class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5.83333 1.66666H14.1667L17.5 5V16.6667C17.5 17.5833 16.75 18.3333 15.8333 18.3333H4.16667C3.25 18.3333 2.5 17.5833 2.5 16.6667V3.33332C2.5 2.41666 3.25 1.66666 4.16667 1.66666H5.83333Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M5.83334 1.66666V5H14.1667V1.66666" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M6.66666 10.8333H13.3333" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M6.66666 14.1667H10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <span>Relatórios</span>
                </a>
                <a href="configuracoes.html" class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="10" cy="10" r="3.33333" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M17.5 10H15.8333M4.16667 10H2.5M10 2.5V4.16667M10 15.8333V17.5M14.7142 5.28582L13.5355 6.46448M6.46448 13.5355L5.28582 14.7142M14.7142 14.7142L13.5355 13.5355M6.46448 6.46448L5.28582 5.28582" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <span>Configurações</span>
                </a>
                <a href="tutorial.html" class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10 17.5C14.1421 17.5 17.5 14.1421 17.5 10C17.5 5.85786 14.1421 2.5 10 2.5C5.85786 2.5 2.5 5.85786 2.5 10C2.5 14.1421 5.85786 17.5 10 17.5Z" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M10 6.66666V10.8333" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        <circle cx="10" cy="13.75" r="0.625" fill="currentColor"/>
                    </svg>
                    <span>Tutorial</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="btn-logout" onclick="logout()">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7.5 17.5H4.16667C3.25 17.5 2.5 16.75 2.5 15.8333V4.16667C2.5 3.25 3.25 2.5 4.16667 2.5H7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M13.3333 14.1667L17.5 10L13.3333 5.83334" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M17.5 10H7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <span>Sair</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <h1>Dashboard</h1>
                </div>
                <div class="topbar-right">
                    <div class="user-info">
                        <span class="user-name" id="userNameDisplay">Usuário Admin</span>
                        <div class="user-avatar">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="12" cy="8" r="4" fill="#1a73e8"/>
                                <path d="M4 20C4 17.7909 7.79086 16 12 16C16.2091 16 20 17.7909 20 20" stroke="#1a73e8" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </header>

            <div class="page-content">
                <!-- KPI Cards -->
                <div class="kpi-grid">
                    <div class="kpi-card">
                        <div class="kpi-icon" style="background: #e3f2fd;">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="#1a73e8">
                                <path d="M4 15L9 10L13 14L20 7" stroke="#1a73e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <div class="kpi-info">
                            <span class="kpi-label">Viagens Hoje</span>
                            <span class="kpi-value" id="kpiViagensHoje">24</span>
                            <span class="kpi-change positive">+12%</span>
                        </div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-icon" style="background: #e8f5e9;">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="#4caf50">
                                <path d="M9 12L11 14L15 10" stroke="#4caf50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <div class="kpi-info">
                            <span class="kpi-label">Entregas Realizadas</span>
                            <span class="kpi-value" id="kpiEntregasRealizadas">18</span>
                            <span class="kpi-change positive">+8%</span>
                        </div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-icon" style="background: #fff3e0;">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="#ff9800">
                                <circle cx="12" cy="12" r="9" stroke="#ff9800" stroke-width="2"/>
                            </svg>
                        </div>
                        <div class="kpi-info">
                            <span class="kpi-label">Em Trânsito</span>
                            <span class="kpi-value" id="kpiEmTransito">6</span>
                            <span class="kpi-change">Estável</span>
                        </div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-icon" style="background: #fce4ec;">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="#f44336">
                                <path d="M12 2L2 22H22L12 2Z" stroke="#f44336" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <div class="kpi-info">
                            <span class="kpi-label">Atrasos</span>
                            <span class="kpi-value" id="kpiAtrasos">2</span>
                            <span class="kpi-change negative">-5%</span>
                        </div>
                    </div>
                </div>

                <!-- Charts Section -->
                <div class="charts-grid">
                    <div class="chart-card">
                        <h3>Viagens por Dia</h3>
                        <canvas id="chartViagensDia"></canvas>
                    </div>
                    <div class="chart-card">
                        <h3>Status das Entregas</h3>
                        <canvas id="chartStatusEntregas"></canvas>
                    </div>
                </div>

                <!-- Recent Activities -->
                <div class="card">
                    <div class="card-header">
                        <h3>Atividades Recentes</h3>
                    </div>
                    <div class="card-body" id="recentActivities">
                        <!-- Populated by JavaScript -->
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="toastContainer"></div>
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
